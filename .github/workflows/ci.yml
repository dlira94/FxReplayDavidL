name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: previews are what we
# actually verify against, so an outdated run is wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # e2e joins this job with the first spec: it needs the browsers
      # (npx playwright install --with-deps) and a served build, and paying
      # for both to run zero tests would be theatre.
